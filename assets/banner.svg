<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Devasish Mishra — Karma, Code, Consciousness">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0E0B24"/><stop offset=".55" stop-color="#1B1240"/><stop offset="1" stop-color="#2A0F2E"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FF9933" stop-opacity=".45"/><stop offset=".6" stop-color="#FF9933" stop-opacity=".08"/><stop offset="1" stop-color="#FF9933" stop-opacity="0"/>
