  </linearGradient>
  <clipPath id="round"><rect width="1200" height="380" rx="22"/></clipPath>
</defs>
<style>
  .cw  { transform-origin: 600.0px 190.0px; animation: spin 90s linear infinite; }
  .ccw { transform-origin: 600.0px 190.0px; animation: spin 60s linear infinite reverse; }
  .breathe { transform-origin: 600.0px 190.0px; animation: breathe 6s ease-in-out infinite; }
  .spark { animation: twinkle 4s ease-in-out infinite; opacity: .15; }
  .rise { animation: rise 2.4s ease-out both; }
  .rise2 { animation: rise 2.4s ease-out .6s both; }
  .rise3 { animation: rise 2.4s ease-out 1.2s both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes twinkle { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
